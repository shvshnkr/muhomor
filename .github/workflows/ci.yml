# CI on push/PR when code changes (not docs-only). Platforms: docs/CI_PLATFORMS.md

name: CI

# push/PR: only when code changes (paths-ignore docs). workflow_dispatch: full matrix anytime.
# Manual run: Actions → CI → "Run workflow" (needs repo Write). Or workflow "Run CI manually".
on:
  workflow_dispatch:
    inputs:
      kit_ui_launcher:
        description: "Kit e2e -UILauncher"
        type: choice
        default: daemon
        options:
          - daemon
          - gui
          - pseudo
          - all
      run_wails_build:
        description: "Run optional Wails build (Windows, slow)"
        type: boolean
        default: false
  push:
    paths-ignore:
      - "docs/**"
      - "AI/**"
      - "**/*.md"
      - ".cursor/**"
      - "LICENSE"
      - "kit/linux/README.txt"
      - "kit/config/README.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "AI/**"
      - "**/*.md"
      - ".cursor/**"
      - "LICENSE"
      - "kit/linux/README.txt"
      - "kit/config/README.txt"

env:
  GO_VERSION: "1.23"
  CGO_ENABLED: "0"
  # workflow_dispatch inputs; empty on push/PR → daemon
  KIT_UI_LAUNCHER: ${{ github.event.inputs.kit_ui_launcher || 'daemon' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate · vet · build · hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend dist (Wails go:embed)
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Stage Wails embed assets
        run: |
          mkdir -p cmd/muhomor-gui/frontend/dist
          cp -r frontend/dist/. cmd/muhomor-gui/frontend/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go build daemon
        run: go build -o /dev/null ./cmd/muhomor

      - name: Publish hygiene (no duplicate go test)
        run: bash scripts/verify-publish-ci.sh

  go-packages:
    name: go packages · ${{ matrix.slice.name }}
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: controller-runtime
            packages: >-
              ./internal/controller/...
              ./internal/simplemode/...
          - name: selector-standby-probe
            packages: >-
              ./internal/selector/...
              ./internal/standby/...
              ./internal/probe/...
              ./internal/profileclass/...
          - name: store-aggregate
            packages: >-
              ./internal/store/...
              ./internal/aggregate/...
          - name: config-routing
            packages: >-
              ./internal/configgen/...
              ./internal/routing/...
          - name: subscription-mihomo-apiclient
            packages: >-
              ./internal/subscription/...
              ./internal/mihomo/...
              ./internal/apiclient/...
          - name: ui-model-pseudogui-wails
            packages: >-
              ./internal/ui/model/...
              ./internal/ui/presenter/...
              ./internal/ui/pseudogui/...
              ./internal/ui/wailsapp/...
          - name: paths-systemd
            packages: >-
              ./internal/paths/...
              ./internal/systemd/...
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go test
        run: go test -count=1 -timeout 120s ${{ matrix.slice.packages }}

  go-regression:
    name: go · regression (pain anchors)
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go test -run Regression
        run: go test -count=1 -timeout 120s -run Regression ./internal/...

  go-integration-matrix:
    name: integration · ${{ matrix.slice.name }}
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: subscription-fetch
            packages: ./internal/subscription/...
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go test (integration tag, network)
        run: go test -tags=integration -count=1 -timeout 120s ${{ matrix.slice.packages }}

  platform-linux-ubuntu:
    name: linux · ubuntu-${{ matrix.version }}
    needs: gate
    runs-on: ubuntu-${{ matrix.version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: go build (daemon)
        run: go build -o /dev/null ./cmd/muhomor
      - name: go test smoke
        run: go test -count=1 -timeout 90s ./internal/paths/... ./internal/apiclient/...

  platform-linux-debian:
    name: linux · debian-${{ matrix.debian }}
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm-slim, bullseye-slim]
    container: debian:${{ matrix.debian }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: go build (daemon)
        run: go build -o /dev/null ./cmd/muhomor
      - name: go test smoke
        run: go test -count=1 -timeout 90s ./internal/paths/... ./internal/apiclient/...

  cross-build:
    name: cross · ${{ matrix.target }}
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win64
            goos: windows
            goarch: amd64
          - target: win32
            goos: windows
            goarch: "386"
          - target: linux64
            goos: linux
            goarch: amd64
          - target: linux32
            goos: linux
            goarch: "386"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: go build muhomor (${{ matrix.target }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /tmp/muhomor-${{ matrix.target }} ./cmd/muhomor

  ui-frontend:
    name: ui · frontend vitest + build
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci, test, build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm test
          npm run build

  platform-windows:
    name: windows · ${{ matrix.label }} kit e2e
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: win22-x64
          - os: windows-2025
            label: win25-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Fetch mihomo (kit e2e)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-mihomo-windows.ps1

      - name: kit e2e smoke (Tier A, no GUI)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/kit-e2e-smoke.ps1 -MinimalPack -UILauncher ${{ env.KIT_UI_LAUNCHER }}

  gui-windows:
    name: gui · wails build (windows-2022)
    needs: ui-frontend
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_wails_build == true
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: frontend dist
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: wails build GUI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build -platform windows/amd64 -o NUL.exe
        shell: bash

  ci-summary:
    name: CI matrix summary
    needs:
      - gate
      - go-packages
      - go-regression
      - go-integration-matrix
      - platform-linux-ubuntu
      - platform-linux-debian
      - cross-build
      - ui-frontend
      - platform-windows
      - gui-windows
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Workflow summary
        run: |
          {
            echo "## CI matrix summary"
            echo
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| gate | ${{ needs.gate.result }} |"
            echo "| go-packages | ${{ needs.go-packages.result }} |"
            echo "| go-regression | ${{ needs.go-regression.result }} |"
            echo "| go-integration-matrix | ${{ needs.go-integration-matrix.result }} |"
            echo "| platform-linux-ubuntu | ${{ needs.platform-linux-ubuntu.result }} |"
            echo "| platform-linux-debian | ${{ needs.platform-linux-debian.result }} |"
            echo "| cross-build (win/linux 386+amd64) | ${{ needs.cross-build.result }} |"
            echo "| ui-frontend | ${{ needs.ui-frontend.result }} |"
            echo "| platform-windows | ${{ needs.platform-windows.result }} |"
            echo "| gui-windows (optional, win11-x64) | ${{ needs.gui-windows.result }} |"
            echo
            echo "Platforms: Ubuntu 22.04/24.04, Debian bookworm/bullseye, Windows 2022/2025 x64, cross win32/win64/linux32/linux64."
            echo "Details: docs/CI_PLATFORMS.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if required jobs failed
        if: >-
          needs.gate.result != 'success' ||
          needs.go-packages.result != 'success' ||
          needs.go-regression.result != 'success' ||
          needs.go-integration-matrix.result != 'success' ||
          needs.platform-linux-ubuntu.result != 'success' ||
          needs.platform-linux-debian.result != 'success' ||
          needs.cross-build.result != 'success' ||
          needs.ui-frontend.result != 'success' ||
          needs.platform-windows.result != 'success'
        run: exit 1
