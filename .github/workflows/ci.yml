# CI on push/PR when code changes (not docs-only). Autotests run here only — no local matrix required.
# Optional local parity: scripts/ci-test-matrix.ps1

name: CI

# Shared: skip workflow when the commit/PR only touches documentation and agent notes.
# workflow_dispatch always runs a full matrix.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "AI/**"
      - "**/*.md"
      - ".cursor/**"
      - "LICENSE"
      - "kit/linux/README.txt"
      - "kit/config/README.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "AI/**"
      - "**/*.md"
      - ".cursor/**"
      - "LICENSE"
      - "kit/linux/README.txt"
      - "kit/config/README.txt"
  workflow_dispatch:

env:
  GO_VERSION: "1.23"
  CGO_ENABLED: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate · vet · build · hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend dist (Wails go:embed)
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Stage Wails embed assets
        run: |
          mkdir -p cmd/muhomor-gui/frontend/dist
          cp -r frontend/dist/. cmd/muhomor-gui/frontend/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go build daemon
        run: go build -o /dev/null ./cmd/muhomor

      - name: Publish hygiene (no duplicate go test)
        run: bash scripts/verify-publish-ci.sh

  go-stability-matrix:
    name: go · ${{ matrix.slice.name }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: controller-runtime
            packages: >-
              ./internal/controller/...
              ./internal/simplemode/...
          - name: selector-standby-probe
            packages: >-
              ./internal/selector/...
              ./internal/standby/...
              ./internal/probe/...
              ./internal/profileclass/...
          - name: store-aggregate
            packages: >-
              ./internal/store/...
              ./internal/aggregate/...
          - name: config-routing
            packages: >-
              ./internal/configgen/...
              ./internal/routing/...
          - name: subscription-mihomo-apiclient
            packages: >-
              ./internal/subscription/...
              ./internal/mihomo/...
              ./internal/apiclient/...
          - name: ui-model-pseudogui-wails
            packages: >-
              ./internal/ui/model/...
              ./internal/ui/presenter/...
              ./internal/ui/pseudogui/...
              ./internal/ui/wailsapp/...
          - name: paths-systemd
            packages: >-
              ./internal/paths/...
              ./internal/systemd/...
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go test
        run: go test -count=1 -timeout 120s ${{ matrix.slice.packages }}

  go-regression:
    name: go · regression (pain anchors)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go test -run Regression
        run: go test -count=1 -timeout 120s -run Regression ./internal/...

  go-integration-matrix:
    name: integration · ${{ matrix.slice.name }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: subscription-fetch
            packages: ./internal/subscription/...
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: go test (integration tag, network)
        run: go test -tags=integration -count=1 -timeout 120s ${{ matrix.slice.packages }}

  ui-frontend:
    name: ui · frontend vitest + build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci, test, build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm test
          npm run build

  kit-e2e-windows:
    name: kit · e2e smoke (daemon API)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Fetch mihomo (kit e2e)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-mihomo-windows.ps1

      - name: kit e2e smoke (Tier A, no GUI)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/kit-e2e-smoke.ps1 -MinimalPack -UILauncher daemon

  gui-windows:
    name: gui · wails build (windows smoke)
    needs: ui-frontend
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: frontend dist
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: wails build GUI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build -platform windows/amd64 -o NUL.exe
        shell: bash

  ci-summary:
    name: CI matrix summary
    needs:
      - gate
      - go-stability-matrix
      - go-regression
      - go-integration-matrix
      - ui-frontend
      - kit-e2e-windows
      - gui-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Workflow summary
        run: |
          {
            echo "## CI matrix summary"
            echo
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| gate | ${{ needs.gate.result }} |"
            echo "| go-stability-matrix | ${{ needs.go-stability-matrix.result }} |"
            echo "| go-regression | ${{ needs.go-regression.result }} |"
            echo "| go-integration-matrix | ${{ needs.go-integration-matrix.result }} |"
            echo "| ui-frontend | ${{ needs.ui-frontend.result }} |"
            echo "| kit-e2e-windows | ${{ needs.kit-e2e-windows.result }} |"
            echo "| gui-windows (optional) | ${{ needs.gui-windows.result }} |"
            echo
            echo "Go slices: controller-runtime, selector-standby-probe, store-aggregate, config-routing, subscription-mihomo-apiclient, ui-model-pseudogui-wails, paths-systemd."
            echo "Regression: \`go test -run Regression ./internal/...\`; kit e2e: \`kit-e2e-smoke.ps1 -MinimalPack\`."
            echo "Integration: subscription-fetch (\`-tags integration\`)."
            echo "UI: vitest + \`tsc\`/\`vite build\`; optional Wails on Windows."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if required jobs failed
        if: >-
          needs.gate.result != 'success' ||
          needs.go-stability-matrix.result != 'success' ||
          needs.go-regression.result != 'success' ||
          needs.go-integration-matrix.result != 'success' ||
          needs.ui-frontend.result != 'success' ||
          needs.kit-e2e-windows.result != 'success'
        run: exit 1
